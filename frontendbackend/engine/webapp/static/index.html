<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>또래 갈등 시나리오 생성기 - 규칙 엔진 데모</title>
<style>
  :root {
    --bg: #faf7f2;
    --card: #ffffff;
    --ink: #2b2b2b;
    --muted: #6b6b6b;
    --accent: #e07a5f;
    --accent-dark: #c85f45;
    --border: #e8e2d8;
    --ok: #4a8c6f;
    --warn: #b5452e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.55;
  }
  header {
    padding: 28px 20px 18px;
    text-align: center;
  }
  header h1 { margin: 0 0 6px; font-size: 1.6rem; }
  header p { margin: 0; color: var(--muted); font-size: 0.95rem; }

  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 0 20px 60px;
  }

  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 20px;
  }

  label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.92rem; }
  .field { margin-bottom: 16px; }
  select, input[type="number"], input[type="text"] {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.95rem;
    background: #fff;
  }
  .row { display: flex; gap: 14px; }
  .row > .field { flex: 1; }

  button {
    border: none;
    border-radius: 10px;
    padding: 12px 20px;
    font-size: 0.98rem;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: #fff; width: 100%; }
  .btn-primary:hover:not(:disabled) { background: var(--accent-dark); }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); font-size: 0.85rem; padding: 8px 14px; }

  #status { margin-top: 14px; font-size: 0.9rem; color: var(--muted); display: none; }
  #status.active { display: block; }

  .error-banner {
    background: #fbe9e7;
    border: 1px solid #e6b3a8;
    color: var(--warn);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 20px;
    font-size: 0.9rem;
    white-space: pre-wrap;
    display: none;
  }
  .error-banner.active { display: block; }

  #rulesPanel {
    display: none;
    margin-top: 14px;
    background: #fbf8f2;
    border: 1px dashed var(--border);
    border-radius: 10px;
    padding: 16px;
    font-size: 0.85rem;
    white-space: pre-wrap;
    max-height: 280px;
    overflow-y: auto;
  }
  #rulesPanel.active { display: block; }

  .scenario-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .badge {
    display: inline-block;
    font-size: 0.78rem;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 999px;
    background: #fdece6;
    color: var(--accent-dark);
    margin-bottom: 10px;
  }
  .scenario-card h3 { margin: 0 0 10px; font-size: 1.1rem; }
  .scenario-card .field-row { margin-bottom: 10px; }
  .scenario-card .field-row .label { font-size: 0.78rem; color: var(--muted); font-weight: 700; margin-bottom: 2px; }
  .ai-line {
    background: #f4f0ea;
    border-radius: 10px;
    padding: 10px 14px;
    font-style: italic;
    margin-top: 6px;
  }

  .issue-card {
    background: #fff8f0;
    border: 1px solid #f0d9b5;
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 10px;
    font-size: 0.85rem;
  }
  .issue-card b { color: var(--warn); }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.78rem;
    padding: 20px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1a18;
      --card: #262320;
      --ink: #ece7e0;
      --muted: #a39c92;
      --border: #3a3530;
    }
    select, input[type="number"], input[type="text"] { background: #201d1a; color: var(--ink); }
    .ai-line { background: #2f2b26; }
    #rulesPanel { background: #201d1a; }
  }
</style>
</head>
<body>
  <header>
    <h1>🛡️ 또래 갈등 시나리오 생성기</h1>
    <p>법적 규제 · 정부 요구사항 · 윤리 기준 · 아동발달 지침을 반영한 규칙 엔진 데모</p>
  </header>

  <main>
    <section class="panel">
      <div class="field">
        <label for="category">시나리오 카테고리</label>
        <select id="category"></select>
      </div>
      <div class="row">
        <div class="field">
          <label for="numScenarios">개수 (1~5)</label>
          <input type="number" id="numScenarios" value="2" min="1" max="5" />
        </div>
        <div class="field">
          <label for="ageRange">대상 연령 (선택)</label>
          <input type="text" id="ageRange" placeholder="초등 1~3학년 (7~9세)" />
        </div>
      </div>
      <button class="btn-primary" id="generateBtn">시나리오 생성하기</button>
      <div id="status"></div>
      <div style="margin-top: 14px;">
        <button class="btn-ghost" id="toggleRulesBtn">📖 이 카테고리에 적용되는 규칙 보기</button>
        <div id="rulesPanel"></div>
      </div>
    </section>

    <div class="error-banner" id="errorBanner"></div>

    <section id="results"></section>
  </main>

  <footer>
    knowledge_base/ 문서를 기반으로 규칙을 검색·적용·검증합니다. 생성 결과는 실제 서비스 배포 전 사람의 검토를 권장합니다.
  </footer>

<script>
const categorySelect = document.getElementById('category');
const numScenariosInput = document.getElementById('numScenarios');
const ageRangeInput = document.getElementById('ageRange');
const generateBtn = document.getElementById('generateBtn');
const statusEl = document.getElementById('status');
const errorBanner = document.getElementById('errorBanner');
const resultsEl = document.getElementById('results');
const toggleRulesBtn = document.getElementById('toggleRulesBtn');
const rulesPanel = document.getElementById('rulesPanel');

const CATEGORY_ICONS = {
  ownership_turn: '🧸',
  physical_boundary: '🤗',
  verbal_discomfort: '😕',
  rule_violation: '🎲',
};

function showError(message) {
  errorBanner.textContent = message;
  errorBanner.classList.add('active');
}
function clearError() {
  errorBanner.classList.remove('active');
  errorBanner.textContent = '';
}

async function loadCategories() {
  const res = await fetch('/api/categories');
  const data = await res.json();
  categorySelect.innerHTML = '';
  for (const [key, label] of Object.entries(data)) {
    const opt = document.createElement('option');
    opt.value = key;
    opt.textContent = `${CATEGORY_ICONS[key] || ''} ${label}`;
    categorySelect.appendChild(opt);
  }
}

function renderScenarios(scenarios) {
  resultsEl.innerHTML = '';
  if (!scenarios.length) {
    resultsEl.innerHTML = '<p style="text-align:center;color:var(--muted)">표시할 시나리오가 없습니다.</p>';
    return;
  }
  for (const s of scenarios) {
    const card = document.createElement('div');
    card.className = 'scenario-card';
    card.innerHTML = `
      <span class="badge">${CATEGORY_ICONS[s.category] || ''} ${s.category}</span>
      <h3>${escapeHtml(s.scenario_title)}</h3>
      <div class="field-row"><div class="label">상황 설명</div>${escapeHtml(s.background)}</div>
      <div class="field-row"><div class="label">갈등 상황</div>${escapeHtml(s.conflict_trigger)}</div>
      <div class="field-row"><div class="label">학습 목표</div>${escapeHtml(s.learning_goal)}</div>
      <div class="field-row">
        <div class="label">AI 캐릭터 첫 대사</div>
        <div class="ai-line">"${escapeHtml(s.ai_first_message)}"</div>
      </div>
    `;
    resultsEl.appendChild(card);
  }
}

function renderIssues(issues) {
  if (!issues.length) return;
  const wrap = document.createElement('div');
  wrap.innerHTML = `<p style="font-weight:700;margin-top:24px;">⚠️ 규칙 위반으로 제외된 시나리오 (${issues.length}건)</p>`;
  for (const issue of issues) {
    const div = document.createElement('div');
    div.className = 'issue-card';
    div.innerHTML = `<b>[${escapeHtml(issue.rule_id)}]</b> (${escapeHtml(issue.severity)}) ${escapeHtml(issue.field)}: ${escapeHtml(issue.message)}`;
    wrap.appendChild(div);
  }
  resultsEl.appendChild(wrap);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}

generateBtn.addEventListener('click', async () => {
  clearError();
  resultsEl.innerHTML = '';
  generateBtn.disabled = true;
  statusEl.textContent = 'Gemini가 시나리오를 만들고 규칙을 검증하는 중입니다... (몇 초 소요)';
  statusEl.classList.add('active');

  try {
    const res = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        category: categorySelect.value,
        num_scenarios: parseInt(numScenariosInput.value, 10) || 1,
        age_range: ageRangeInput.value || null,
      }),
    });
    const data = await res.json();
    if (!res.ok) {
      showError(data.detail || '알 수 없는 오류가 발생했습니다.');
      return;
    }
    renderScenarios(data.scenarios);
    renderIssues(data.issues);
  } catch (e) {
    showError('서버에 연결할 수 없습니다: ' + e.message);
  } finally {
    generateBtn.disabled = false;
    statusEl.classList.remove('active');
  }
});

toggleRulesBtn.addEventListener('click', async () => {
  if (rulesPanel.classList.contains('active')) {
    rulesPanel.classList.remove('active');
    return;
  }
  rulesPanel.textContent = '불러오는 중...';
  rulesPanel.classList.add('active');
  const res = await fetch(`/api/rules?category=${encodeURIComponent(categorySelect.value)}`);
  const data = await res.json();
  rulesPanel.textContent = data.rule_sections;
});

loadCategories().catch((e) => showError('카테고리를 불러오지 못했습니다: ' + e.message));
</script>
</body>
</html>
