<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="512" height="512">
  <style>
    .eye{fill:#3B3222}
    .eye-arc{display:none;fill:none;stroke:#3B3222;stroke-width:7;stroke-linecap:round}
    .brows{display:none}
    .brow{fill:none;stroke:#3B3222;stroke-width:7;stroke-linecap:round}
    .mouth{display:none;fill:none;stroke:#3B3222;stroke-width:6;stroke-linecap:round}
    .m-grin,.m-o{fill:#7A4A48;stroke:none}
    .m-smile{display:block}          /* idle 기본 표정 */
    .extras>*{display:none}
    .blush ellipse{fill:#F09AA8;opacity:.6}
    .tear{fill:#7FB3E8} .sweat{fill:#9CC9F0} .spark path{fill:#FFC12E}
    .dots,.hand{display:none}
    .yk-syrup{display:none}         /* 약과 화해 조청 — 연출 중에만 */
    .kk-drip{display:none}          /* 꿀떡 흘러넘치는 방울 — 누를 때만 */
    .honey-coat{display:none}       /* 무지개떡 꿀 코팅 — 완성 보상에서만 */
    .pat-burst{display:none}
  </style>
<g class="body"><circle cx="100" cy="122" r="52" fill="#F6F0E4"/><ellipse class="kk-honey" cx="100" cy="134" rx="26" ry="18" fill="#E8A93C" opacity=".55"/><g class="face"><g class="brows"><path class="brow bl" d="M68,89 q15,-9 30,0"/><path class="brow br" d="M102,89 q15,-9 30,0"/></g><g class="eyes"><ellipse class="eye" cx="83" cy="116" rx="6" ry="7.199999999999999"/><ellipse class="eye" cx="117" cy="116" rx="6" ry="7.199999999999999"/><path class="eye-arc" d="M72,119 q11,-15 22,0"/><path class="eye-arc" d="M106,119 q11,-15 22,0"/></g><path class="mouth m-smile" d="M84,140 q16,16 32,0"/><path class="mouth m-flat"  d="M87,144 h26"/><ellipse class="mouth m-open" cx="100" cy="146" rx="14" ry="12"/><path class="mouth m-grin"  d="M79,137 q21,28 42,0 Z"/><path class="mouth m-frown" d="M85,149 q15,-15 30,0"/><path class="mouth m-wavy"  d="M82,144 q9,-9 18,0 q9,9 18,0"/><ellipse class="mouth m-o"  cx="100" cy="145" rx="9" ry="12"/><g class="extras"><g class="blush"><ellipse cx="68" cy="132" rx="12" ry="7"/><ellipse cx="132" cy="132" rx="12" ry="7"/></g><path class="tear"  d="M83,129 c-6,9 -9,13 -9,17 a9,9 0 0 0 18,0 c0,-4 -3,-8 -9,-17 Z"/><path class="sweat" d="M139,80 c-5,8 -8,11 -8,15 a8,8 0 0 0 16,0 c0,-4 -3,-7 -8,-15 Z"/><g class="spark"><path transform="translate(55,84)" d="M0,-9 L2.5,-2.5 L9,0 L2.5,2.5 L0,9 L-2.5,2.5 L-9,0 L-2.5,-2.5 Z"/><path transform="translate(145,80)" d="M0,-9 L2.5,-2.5 L9,0 L2.5,2.5 L0,9 L-2.5,2.5 L-9,0 L-2.5,-2.5 Z"/><path transform="translate(137,142)" d="M0,-9 L2.5,-2.5 L9,0 L2.5,2.5 L0,9 L-2.5,2.5 L-9,0 L-2.5,-2.5 Z"/></g></g></g><path class="kk-drip" d="M100,168 c-5,8 -8,11 -8,15 a8,8 0 0 0 16,0 c0,-4 -3,-7 -8,-15 Z" fill="#E8A93C"/></g>
